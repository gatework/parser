version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - nilerr
    - nolintlint
    - errorlint
    - revive
    - modernize
    - gocritic
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
